<div class="max-w-7xl mx-auto px-4 sm:px-6 py-8 text-slate-100">

    @if (loading()) {
    <div class="flex flex-col items-center justify-center py-24 space-y-4">
        <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-slate-400 text-sm font-medium animate-pulse">Chargement des données...</p>
    </div>
    } @else if (analytics()) {
    @let card = analytics()!;

    <!-- 🌟 GRANDE CARTE UNIQUE (HERO SECTION) -->
    <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 sm:p-8 backdrop-blur-md shadow-2xl">

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

            <!-- 1. COLONNE GAUCHE (4/12) : Visuel Carte & Marketplaces -->
            <div class="lg:col-span-4 flex flex-col items-center space-y-6">
                <app-card-media-links [scryfallData]="scryfallData()" [purchaseUris]="card.purchaseUris">
                </app-card-media-links>
            </div>

            <!-- 2. COLONNE DROITE (8/12) : Infos, Sélecteur, KPIs & Chart -->
            <div class="lg:col-span-8 space-y-6">

                <!-- En-tête Unifié : Titre + Badge Recommandation + Sélecteur -->
                <div class="space-y-4 pb-6 border-b border-slate-800/80">

                    <div class="flex flex-wrap items-start justify-between gap-4">
                        <!-- Titre & Badge Édition -->
                        <div>
                            <span
                                class="text-[11px] font-mono font-bold uppercase tracking-wider px-2.5 py-1 rounded-md bg-indigo-500/10 border border-indigo-500/20 text-indigo-400">
                                {{ scryfallData()?.set | uppercase }} — {{ scryfallData()?.set_name }}
                            </span>
                            <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight mt-2">
                                {{ scryfallData()?.name }}
                            </h1>
                        </div>

                        <!-- Recommandation Algo (Placée à côté du titre !) -->
                        <div [class]="getRecommendationBadgeClass(card.recommendation.action)"
                            class="px-5 py-2.5 rounded-xl border flex items-center justify-center shadow-lg">
                            <span class="text-lg font-black tracking-widest uppercase">{{ card.recommendation.action
                                }}</span>
                        </div>
                    </div>

                    <!-- Conseil Algo (Sans boîte lourde) -->
                    <p class="text-slate-400 text-sm flex items-center gap-2">
                        <span class="text-amber-400">💡</span>
                        <strong class="text-slate-200 font-semibold">Analyse :</strong> {{ card.recommendation.reason }}
                    </p>

                    <!-- Sélecteur d'Édition & Alerte (Intégrés dans la ligne) -->
                    <app-card-print-selector [cardData]="scryfallData()" [prints]="prints()"
                        [isLoadingPrints]="isLoadingPrints()" (onSelectPrint)="onSelectPrint($event)">
                    </app-card-print-selector>
                </div>

                <!-- KPIs Financiers (Design minimaliste sans sous-cartes opaques) -->
                <app-card-financial-metrics [recommendation]="card.recommendation" [currentPrice]="card.currentPrice"
                    [change24h]="card.change24h" [movingAverage30d]="card.movingAverage30d"
                    [volatility]="card.volatility" [allTimeLow]="card.allTimeLow" [allTimeHigh]="card.allTimeHigh">
                </app-card-financial-metrics>

                <!-- Graphique Dépouillé (Agréable et àéré) -->
                <app-card-price-chart [chartData]="card.priceHistory">
                </app-card-price-chart>

            </div>

        </div>

    </div>
    }
</div>
