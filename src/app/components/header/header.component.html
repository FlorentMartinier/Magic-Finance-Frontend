<header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-50 transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4 md:gap-8">

        <!-- Logo avec Effet Glow & Gradient -->
        <a routerLink="/" class="flex items-center gap-2.5 group shrink-0">
            <div
                class="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center text-lg shadow-lg shadow-purple-500/20 group-hover:scale-105 transition-transform">
                ✨
            </div>
            <span class="text-xl font-bold tracking-tight text-white">
                MTG<span
                    class="bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Finance</span>
            </span>
        </a>

        <!-- Barre de recherche centrale avec icônes -->
        <div class="relative flex-1 max-w-lg">
            <div class="relative flex items-center">
                <!-- Icône Loupe -->
                <div class="absolute left-3.5 pointer-events-none text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>

                <input type="text" [(ngModel)]="searchQuery" (input)="onSearchInput()"
                    placeholder="Rechercher une carte (ex: Black Lotus, Orcish Bowmasters)..."
                    class="w-full bg-slate-950/80 text-slate-100 placeholder-slate-500 text-sm rounded-xl pl-10 pr-10 py-2.5 border border-slate-800 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition shadow-inner" />

                <!-- Bouton Clear (si du texte est saisi) -->
                @if (searchQuery) {
                <button (click)="searchQuery = ''; onSearchInput()"
                    class="absolute right-3 text-slate-400 hover:text-slate-200 text-xs bg-slate-800 rounded-full w-4 h-4 flex items-center justify-center">
                    ✕
                </button>
                }
            </div>

            <!-- Auto-completion / Autocomplete Dropdown -->
            @if (suggestions().length > 0) {
            <ul
                class="absolute w-full bg-slate-900/95 backdrop-blur-lg border border-slate-700/80 rounded-xl mt-2 shadow-2xl max-h-72 overflow-y-auto z-50 divide-y divide-slate-800/50">
                @for (suggestion of suggestions(); track suggestion) {
                <li (click)="selectCard(suggestion)"
                    class="px-4 py-3 hover:bg-indigo-600/20 hover:text-white cursor-pointer text-slate-300 transition-colors text-sm flex items-center justify-between group">
                    <span class="font-medium group-hover:translate-x-0.5 transition-transform">{{ suggestion }}</span>
                    <span
                        class="text-xs text-slate-500 group-hover:text-indigo-400 transition-colors flex items-center gap-1">
                        Voir fiche
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </span>
                </li>
                }
            </ul>
            }
        </div>

        <!-- Navigation / Actions -->
        <nav class="flex items-center gap-3 shrink-0">
            <a routerLink="/my-alerts" routerLinkActive="bg-indigo-600/20 text-indigo-300 border-indigo-500/50"
                class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-medium text-slate-300 bg-slate-800/60 hover:bg-slate-800 hover:text-white border border-slate-700/60 transition-all shadow-sm">
                <span class="relative flex h-2 w-2">
                    <!-- Petit point vert clignotant pour donner un effet "Live/Actif" -->
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span>Mes Alertes</span>
            </a>
        </nav>

    </div>
</header>
