<div class="grid grid-cols-2 sm:grid-cols-4 gap-4 py-2">

    <!-- Prix Actuel -->
    <div class="bg-slate-950/40 p-4 rounded-2xl border border-slate-800/50">
        <span class="text-[11px] text-slate-400 font-medium uppercase tracking-wider block">Prix Actuel</span>
        <div class="text-2xl font-bold font-mono text-white mt-1">{{ currentPrice.toFixed(2) }} €</div>
        <span [class]="change24h >= 0 ? 'text-emerald-400' : 'text-rose-400'"
            class="text-xs font-mono font-medium block mt-0.5">
            {{ change24h >= 0 ? '+' : '' }}{{ change24h }}% (24h)
        </span>
    </div>

    <!-- Moyenne 30j -->
    <div class="bg-slate-950/40 p-4 rounded-2xl border border-slate-800/50">
        <span class="text-[11px] text-slate-400 font-medium uppercase tracking-wider block">Moyenne 30j</span>
        <div class="text-2xl font-bold font-mono text-slate-200 mt-1">{{ movingAverage30d.toFixed(2) }} €</div>
        <span class="text-[11px] text-slate-500 block mt-0.5">Lissage mobile</span>
    </div>

    <!-- Volatilité -->
    <div class="bg-slate-950/40 p-4 rounded-2xl border border-slate-800/50">
        <span class="text-[11px] text-slate-400 font-medium uppercase tracking-wider block">Volatilité (σ)</span>
        <div class="text-2xl font-bold font-mono text-amber-400 mt-1">{{ volatility.toFixed(2) }}</div>
        <span class="text-[11px] text-slate-500 block mt-0.5">Niveau de risque</span>
    </div>

    <!-- Min / Max -->
    <div class="bg-slate-950/40 p-4 rounded-2xl border border-slate-800/50">
        <span class="text-[11px] text-slate-400 font-medium uppercase tracking-wider block">Min / Max</span>
        <div class="text-sm font-bold font-mono text-slate-300 mt-2 flex items-center gap-1">
            <span class="text-emerald-400">{{ allTimeLow }}€</span>
            <span class="text-slate-600">/</span>
            <span class="text-rose-400">{{ allTimeHigh }}€</span>
        </div>
        <span class="text-[11px] text-slate-500 block mt-0.5">Historique</span>
    </div>

</div>
