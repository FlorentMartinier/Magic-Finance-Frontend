<button
    class="relative inline-flex items-center justify-center gap-2.5 px-5 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200 ease-out cursor-pointer select-none border disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 active:scale-95 shadow-md hover:shadow-lg"
    [ngClass]="{
    'bg-slate-800/80 hover:bg-indigo-600 text-slate-200 hover:text-white border-slate-700 hover:border-indigo-500 shadow-indigo-500/10 hover:shadow-indigo-500/25': !isSubscribed,
    'bg-amber-500/10 hover:bg-rose-600/20 text-amber-400 hover:text-rose-300 border-amber-500/30 hover:border-rose-500/40 shadow-amber-500/5': isSubscribed
  }" [disabled]="isLoading" (click)="toggleAlert()">

    <ng-container *ngIf="!isLoading; else loadingTpl">
        <!-- État : Non abonné (M'alerter) -->
        <ng-container *ngIf="!isSubscribed">
            <span class="text-base transition-transform group-hover:rotate-12 duration-200">🔔</span>
            <span>M'alerter des opportunités</span>
        </ng-container>

        <!-- État : Abonné (Désactiver) -->
        <ng-container *ngIf="isSubscribed">
            <span class="text-base">🔕</span>
            <span>Désactiver les alertes</span>
        </ng-container>
    </ng-container>

    <ng-template #loadingTpl>
        <div class="flex items-center gap-2">
            <!-- Spinner SVG élégant à la place de l'émoji sablier -->
            <svg class="animate-spin h-4 w-4 text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            <span class="text-slate-400">Enregistrement...</span>
        </div>
    </ng-template>
</button>
