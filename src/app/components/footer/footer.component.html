<footer class="mt-auto border-t border-slate-800/80 bg-slate-950/60 backdrop-blur-md text-slate-400">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
        <div class="flex flex-col md:flex-row items-center justify-between gap-6">

            <!-- Brand & Copyright avec ton nom -->
            <div class="flex flex-col items-center md:items-start gap-2">
                <p class="text-xs text-slate-500 text-center md:text-left">
                    © {{ currentYear }} MTG Finance — {{ 'FOOTER.DEVELOPED_BY' | translate }}
                    <a href="https://florent-martinier.netlify.app/" target="_blank"
                        class="text-slate-400 hover:text-indigo-400 underline transition">Florent
                        Martinier</a>.
                </p>
            </div>

            <!-- Liens Réseaux / Contact -->
            <div class="flex items-center gap-3">
                @for (social of socials; track social.name) {
                <a [href]="social.url" [target]="social.isExternal ? '_blank' : '_self'"
                    [rel]="social.isExternal ? 'noopener noreferrer' : ''" [title]="social.name"
                    [ngClass]="social.hoverColor"
                    class="p-2.5 rounded-xl bg-slate-900/80 border border-slate-800 text-slate-400 transition-all duration-200 hover:scale-110 shadow-sm flex items-center justify-center group">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                        <path [attr.d]="social.iconSvg" />
                    </svg>
                    <span class="sr-only">{{ social.name }}</span>
                </a>
                }
            </div>

        </div>

        <!-- Mention Légale MTG -->
        <div class="mt-6 pt-4 border-t border-slate-900 text-[11px] text-slate-600 text-center leading-relaxed">
            {{ 'FOOTER.DISCLAIMER' | translate }}
        </div>
    </div>
</footer>
